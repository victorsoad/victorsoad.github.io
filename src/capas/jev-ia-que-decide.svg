<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- entrada: estado do programa -->
  <rect x="92" y="138" width="40" height="44" rx="3" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <g stroke="#B9B9B3" stroke-width="1"><line x1="99" y1="150" x2="125" y2="150"/><line x1="99" y1="159" x2="121" y2="159"/><line x1="99" y1="168" x2="125" y2="168"/></g>
  <g stroke="#0E0E0E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="134" y1="160" x2="160" y2="160"/><polyline points="154,155 160,160 154,165"/>
  </g>
  <!-- decisão -->
  <path d="M190 132 L218 160 L190 188 L162 160 Z" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.5"/>
  <text x="190" y="163" font-family="IBM Plex Mono, monospace" font-size="9" fill="#0E0E0E" text-anchor="middle">0,93</text>
  <!-- régua de probabilidade com limiar -->
  <line x1="150" y1="226" x2="250" y2="226" stroke="#77776F" stroke-width="1"/>
  <g stroke="#77776F" stroke-width="1"><line x1="150" y1="222" x2="150" y2="230"/><line x1="250" y1="222" x2="250" y2="230"/></g>
  <rect x="220" y="216" width="4" height="20" fill="#FFC400" stroke="#0E0E0E" stroke-width="1"/>
  <text x="222" y="250" font-family="IBM Plex Mono, monospace" font-size="8" fill="#2E2E2C" text-anchor="middle">[ LIMIAR ]</text>
  <!-- saídas -->
  <g stroke="#0E0E0E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M218 160 C242 160 246 104 272 104"/><polyline points="266,99 272,104 266,109"/>
    <path d="M218 160 C242 160 246 206 272 206" stroke="#77776F" stroke-dasharray="3 3"/>
  </g>
  <!-- automático -->
  <rect x="276" y="88" width="56" height="32" rx="4" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.3"/>
  <polyline points="294,104 301,111 315,96" stroke="#0E0E0E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pessoa -->
  <circle cx="300" cy="196" r="7" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <path d="M286 222 C286 210 314 210 314 222" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <text x="304" y="82" font-family="IBM Plex Mono, monospace" font-size="8" fill="#2E2E2C" text-anchor="middle">[ SEGUE ]</text>
</svg>
