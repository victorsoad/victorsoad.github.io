<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- requisições chegando -->
  <g stroke="#77776F" stroke-width="1.2">
    <rect x="96" y="128" width="26" height="16" rx="2" fill="#FAFAF8"/>
    <rect x="96" y="152" width="26" height="16" rx="2" fill="#FAFAF8"/>
    <rect x="96" y="176" width="26" height="16" rx="2" fill="#FAFAF8"/>
  </g>
  <g stroke="#0E0E0E" stroke-width="1.2" stroke-linecap="round">
    <line x1="126" y1="160" x2="160" y2="160"/>
    <polyline points="154,155 160,160 154,165" stroke-linejoin="round"/>
  </g>
  <!-- roteador (ponto principal) -->
  <path d="M190 132 L218 160 L190 188 L162 160 Z" fill="#FFC400" stroke="#0E0E0E" stroke-width="1.5"/>
  <text x="190" y="206" font-family="IBM Plex Mono, monospace" font-size="8" fill="#2E2E2C" text-anchor="middle">[ POR TAREFA ]</text>
  <!-- saídas -->
  <g stroke="#0E0E0E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M218 160 C240 160 244 92 270 92"/>
    <path d="M218 160 L270 160"/>
    <path d="M218 160 C240 160 244 228 270 228"/>
  </g>
  <g stroke="#B9B9B3" stroke-width="1" stroke-dasharray="3 3">
    <line x1="218" y1="160" x2="270" y2="160"/>
  </g>
  <!-- modelos: grande, médio, pequeno -->
  <rect x="272" y="62" width="76" height="60" rx="5" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.5"/>
  <rect x="272" y="140" width="56" height="40" rx="4" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.3"/>
  <rect x="272" y="216" width="34" height="24" rx="3" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#77776F">
    <text x="310" y="96" text-anchor="middle">$$$$</text>
    <text x="300" y="164" text-anchor="middle">$$</text>
    <text x="289" y="231" text-anchor="middle">$</text>
  </g>
  <!-- fallback -->
  <path d="M328 172 C352 190 340 214 310 224" stroke="#77776F" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="346" y="204" font-family="IBM Plex Mono, monospace" font-size="8" fill="#2E2E2C">[ FALLBACK ]</text>
</svg>
