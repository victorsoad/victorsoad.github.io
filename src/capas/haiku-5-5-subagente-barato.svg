<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" font-family="IBM Plex Mono, monospace">
  <!-- modelo grande: painel que decide -->
  <rect x="215" y="40" width="150" height="90" rx="4" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.5"/>
  <line x1="230" y1="62" x2="320" y2="62" stroke="#77776F" stroke-width="1"/>
  <line x1="230" y1="76" x2="300" y2="76" stroke="#77776F" stroke-width="1"/>
  <rect x="230" y="92" width="70" height="20" rx="2" fill="#FFC400" stroke="#0E0E0E" stroke-width="1"/>
  <path d="M236 102 l5 5 l10 -10" stroke="#0E0E0E" stroke-width="1.5"/>
  <text x="215" y="30" font-size="8" fill="#0E0E0E">[ DECIDE ]</text>
