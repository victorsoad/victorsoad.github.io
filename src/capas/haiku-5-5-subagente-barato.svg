    <line x1="232" y1="214" x2="268" y2="214"/><line x1="232" y1="224" x2="258" y2="224"/>
    <line x1="304" y1="214" x2="340" y2="214"/><line x1="304" y1="224" x2="330" y2="224"/>
  </g>
  <text x="150" y="258" font-size="8" fill="#0E0E0E">[ EXECUTAM ]</text>
  <!-- setas de resumo subindo -->
  <g stroke="#77776F" stroke-width="1" stroke-dasharray="3 3">
    <path d="M178 198 L250 134"/>
    <path d="M250 198 L280 134"/>
    <path d="M322 198 L310 134"/>
  </g>
  <g fill="#77776F">
