<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" font-family="IBM Plex Mono, monospace">
  <!-- painel da linha do tempo -->
  <rect x="120" y="70" width="250" height="170" rx="4" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <line x1="120" y1="215" x2="370" y2="215" stroke="#B9B9B3" stroke-width="1"/>
  <g stroke="#B9B9B3" stroke-width="1"><line x1="170" y1="211" x2="170" y2="219"/><line x1="230" y1="211" x2="230" y2="219"/><line x1="290" y1="211" x2="290" y2="219"/><line x1="350" y1="211" x2="350" y2="219"/></g>
  <!-- barras: .NET 8 e 9 terminam no marco; .NET 10 segue -->
  <rect x="135" y="95" width="95" height="16" rx="2" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <rect x="160" y="125" width="70" height="16" rx="2" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <rect x="190" y="155" width="165" height="16" rx="2" fill="#FAFAF8" stroke="#0E0E0E" stroke-width="1.2"/>
  <rect x="250" y="185" width="105" height="16" rx="2" fill="#FAFAF8" stroke="#77776F" stroke-width="1" stroke-dasharray="3 3"/>
  <g fill="#77776F" font-size="8"><text x="140" y="106">8</text><text x="165" y="136">9</text><text x="195" y="166">10</text><text x="255" y="196">11</text></g>
  <!-- marco amarelo: 10/11 -->
  <rect x="228" y="62" width="4" height="160" fill="#FFC400"/>
  <circle cx="230" cy="62" r="5" fill="#FFC400" stroke="#0E0E0E" stroke-width="1.2"/>
  <!-- X no fim das barras 8 e 9 -->
  <g stroke="#0E0E0E" stroke-width="1.3"><path d="M238 99l8 8M246 99l-8 8"/><path d="M238 129l8 8M246 129l-8 8"/></g>
  <text x="240" y="56" font-size="8" fill="#0E0E0E" letter-spacing=".5">[ 10/11 ]</text>
  <text x="190" y="255" font-size="8" fill="#77776F" letter-spacing=".5">[ LTS ]</text>
  <line x1="210" y1="245" x2="210" y2="173" stroke="#77776F" stroke-width="1"/>
</svg>
